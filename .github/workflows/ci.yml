name: CI - Verificar Pull Request

# Se dispara al abrir un PR hacia main y en cada push a ese PR
"on":
  pull_request:
    branches:
      - main

jobs:
  verificar:
    name: Verificar codigo, pruebas, formato y base de datos
    runs-on: ubuntu-latest
    environment: DATABASE_URL

    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar que el codigo compile
        run: python -m compileall -q main.py src/database/seeder.py

      - name: Ejecutar pruebas automatizadas con Pytest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m pytest -v

      - name: Verificar formato PEP 8 con Pylint
        run: python -m pylint main.py src/database/seeder.py

      - name: Verificar que la app FastAPI se pueda importar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -c "from main import app; print('Rutas registradas', len(app.routes))"

      - name: Verificar la conexion a la base de datos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scripts.verificar_bd

      - name: Construir imagen Docker
        run: docker build -t estudiantes-api:ci .

      - name: Ejecutar la API usando la imagen Docker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          docker run -d --name api-ci -p 8000:8000 -e DATABASE_URL estudiantes-api:ci
          curl --fail --retry 10 --retry-delay 3 --retry-connrefused http://localhost:8000/docs
          docker logs api-ci
          docker stop api-ci
