name: CD - Alejandro Jaramillo Agudelo - Migrar y sembrar Mascota

"on":
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cd-alejandro-jaramillo-agudelo
  cancel-in-progress: false

jobs:
  migrar-y-sembrar-mascota:
    name: Crear tabla de Mascota y cargar datos base
    runs-on: ubuntu-latest
    environment: DATABASE_URL

    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crear tabla de Mascota y ejecutar el seeder
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.database.seeder_alejo