name: CD - Migrar y sembrar la base de datos

# Se ejecuta cuando hay un push a main y tambien se puede ejecutar manualmente

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Evita que dos ejecuciones escriban en la base al mismo tiempo
concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  migrar-y-sembrar:
    name: Migrar y sembrar la base de datos
    runs-on: ubuntu-latest
    environment: DATABASE_URL

    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar migraciones de Alembic
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: alembic upgrade head

      - name: Ejecutar seeder
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.database.seeder